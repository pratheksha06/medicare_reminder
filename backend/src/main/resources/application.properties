# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/medicare_db
spring.data.mongodb.database=medicare_db

# Server
server.port=8085

# JWT
app.jwt.secret=MediCareSecretKey2025SuperLongSecretKeyForJWTTokenGeneration
app.jwt.expiration=86400000

# Mail (configure with your SMTP to enable email notifications)
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Twilio SMS
twilio.account.sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN
twilio.phone.number=+1XXXXXXXXXX

# CORS
app.cors.allowed-origins=http://localhost:5173

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging
logging.level.com.medicare=DEBUG
logging.level.org.springframework.security=INFO
